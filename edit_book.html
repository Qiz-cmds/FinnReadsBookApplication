
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - FinnReads</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-logo">
                <img src="images/finnNew.png" alt="Book logo">
            </div>

            <h2>FinnReads</h2>
            <p>Find Your Desire Books !</p>

            <nav>
                <a class="menu-link" href="SearchBook.html">Find Books</a>
                <a class="menu-link active-menu" href="reading_list.html">My Reading List</a>
                <a class="menu-link" href="recommendations.html">Recommendations</a>
                <a class="menu-link" href="reading_goal.html">Reading Goal</a>
            </nav>

        </aside>

        <main class="main-content">

            <h1>Edit Book</h1>

            <div id="editBookDetails">
                <div id="editBookCover" class="edit-book-cover"></div>
                <h2 id="editBookTitle"></h2>

                <label for="editStatus">Reading Status:</label>

                <select id="editStatus">
                    <option value="To Read">To Read</option>
                    <option value="Reading">Reading</option>
                    <option value="Completed">Completed</option>
                </select>

                <br><br>

                <label for="editPages">Pages Read:</label>

                <input
                    type="number"
                    id="editPages"
                    placeholder="Enter pages read"
                >

                <p id="editError" style="color: red;"></p>

                <button id="saveEditButton">Save Changes</button>

                <button id="deleteEditButton">Delete Book</button>

                <button onclick="window.location.href='reading_list.html'">
                    Cancel
                </button>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
